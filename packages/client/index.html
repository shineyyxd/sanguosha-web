<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1f2b" />
    <title>三国杀网页版</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* 禁止橡皮筋滚动 / 双击缩放 / 长按选中文本 */
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: #1a1f2b;
        color: #e8e4d8;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        touch-action: none; /* 牌桌内触摸全部交给 Phaser */
      }
      /* 大厅/房间/选将场景的 DOM 覆盖层：全屏自适应 + 刘海屏安全区 */
      .sgs-overlay {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        padding:
          calc(16px + env(safe-area-inset-top))
          calc(16px + env(safe-area-inset-right))
          calc(16px + env(safe-area-inset-bottom))
          calc(16px + env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y; /* 覆盖层内允许纵向滚动（选将/房间列表） */
        pointer-events: none;
      }
      .sgs-overlay > * {
        pointer-events: auto;
      }
      .sgs-overlay h1 {
        font-size: clamp(28px, 6vw, 42px);
        letter-spacing: 8px;
        margin: 0 0 12px;
        text-align: center;
      }
      .sgs-overlay input {
        /* ≥16px 字号避免 iOS Safari 聚焦时自动放大 */
        width: min(260px, 60vw);
        padding: 12px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #555;
        background: #11151d;
        color: #e8e4d8;
      }
      .sgs-overlay button {
        min-height: 44px; /* 触屏热区 */
        padding: 10px 28px;
        font-size: 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        background: #8a6d3b;
        color: #fff;
      }
      .sgs-overlay button:disabled {
        background: #444;
        cursor: not-allowed;
      }
      .sgs-overlay .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      .sgs-overlay .error {
        color: #ff7b72;
        min-height: 20px;
        text-align: center;
      }
      .sgs-overlay .hint {
        color: #9aa0aa;
        font-size: 13px;
        text-align: center;
      }
      .sgs-room-list {
        width: min(420px, 92vw);
        background: #11151d;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 16px;
      }
      .sgs-room-list .player-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 4px;
        border-bottom: 1px solid #222;
      }
      /* 大厅账号区 / 战绩面板：沿用房间列表的卡片样式 */
      .sgs-auth {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .sgs-auth input {
        width: min(160px, 40vw);
      }
      .sgs-account-name {
        color: #c9b98a;
        font-size: 16px;
      }
      .sgs-stats {
        width: min(420px, 92vw);
        max-height: 45vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: #11151d;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 16px;
        font-size: 14px;
      }
      .sgs-stats .player-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 4px;
        border-bottom: 1px solid #222;
      }
      /* 选将覆盖层（牌桌场景）：手机上横向滑动浏览候选卡片 */
      .sgs-draft-list {
        display: flex;
        gap: 16px;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding: 8px 4px;
      }
      .sgs-general-card {
        flex: 0 0 auto;
        width: min(210px, 62vw);
        background: #11151d;
        border: 2px solid #8a6d3b;
        border-radius: 8px;
        padding: 14px;
        cursor: pointer;
      }
      .sgs-general-card:hover {
        border-color: #ffd700;
      }
      .sgs-general-card.picked {
        border-color: #ffd700;
        background: #1d2733;
        cursor: default;
      }
      .sgs-general-card h3 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .sgs-general-card .meta {
        color: #c9b98a;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .sgs-general-card .skill {
        font-size: 12px;
        color: #b8bfca;
        margin-bottom: 6px;
        line-height: 1.5;
      }
      /* 竖屏进入牌桌时的旋转提示遮罩（不强制旋转，仅提示） */
      #sgs-rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(10, 14, 18, 0.94);
        color: #e8e4d8;
        font-size: 22px;
        letter-spacing: 4px;
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #sgs-rotate-hint.visible {
        display: flex;
      }
      #sgs-rotate-hint .sgs-rotate-icon {
        font-size: 56px;
        animation: sgs-rotate-sway 1.6s ease-in-out infinite;
      }
      #sgs-rotate-hint .sgs-rotate-sub {
        font-size: 13px;
        color: #9aa0aa;
        letter-spacing: 0;
      }
      @keyframes sgs-rotate-sway {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
